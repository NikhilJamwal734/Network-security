ltm profile client-ssl /Common/example_clientssl {
    defaults-from /Common/clientssl
    options { no-tlsv1.3 no-sslv3 }
}
ltm profile server-ssl /Common/example_serverssl {
    defaults-from /Common/serverssl
    ciphers DEFAULT
    peer-cert-mode ignore
}
ltm profile http /Common/example_http {
    defaults-from /Common/http
    hsts {
        mode disabled
    }
}
ltm virtual /Common/example_virtual {
    destination /Common/203.0.113.10:443
    profiles {
        /Common/example_clientssl { context clientside }
        /Common/example_serverssl { context serverside }
        /Common/example_http { }
    }
}
