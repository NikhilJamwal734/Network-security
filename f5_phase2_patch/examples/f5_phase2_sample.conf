# Safe synthetic example; no secrets, real addresses or credentials.
ltm profile client-ssl /Common/sample_clientssl {
    options { no-tlsv1.3 }
}
ltm profile server-ssl /Common/sample_serverssl {
    ciphers DEFAULT
    peer-cert-mode ignore
}
ltm profile http /Common/sample_http {
    hsts { mode disabled }
}
ltm rule /Common/custom_http_rule {
    when HTTP_REQUEST {
        if { [HTTP::uri] contains "/test" } {
            ASM::disable
        }
    }
}
ltm virtual /Common/sample_https_vs {
    destination /Common/192.0.2.10:443
    profiles {
        /Common/sample_clientssl { context clientside }
        /Common/sample_serverssl { context serverside }
        /Common/sample_http { }
    }
    rules { /Common/custom_http_rule }
    security-log-profiles { none }
}
