!
! Firewall Analyzer Test Configuration
!

hostname ASA-FIREWALL

!
! ============================================================
! NETWORK OBJECTS
! ============================================================
!

object network WEB01
 host 10.10.10.10

object network WEB02
 host 10.10.10.11

object network INTERNAL_NETWORK
 subnet 10.10.0.0 255.255.0.0

object network DATABASE
 host 10.20.10.10

!
! ============================================================
! NETWORK OBJECT GROUP
! ============================================================
!

object-group network WEB_SERVERS
 network-object host 10.10.10.10
 network-object host 10.10.10.11
 network-object 10.10.20.0 255.255.255.0

!
! ============================================================
! NESTED OBJECT GROUP
! ============================================================
!

object-group network ALL_WEB_SERVERS
 group-object WEB_SERVERS
 network-object host 10.10.30.10

!
! ============================================================
! SERVICE OBJECTS
! ============================================================
!

object service HTTPS_SERVICE
 service-object tcp eq 443

object service SSH_SERVICE
 service-object tcp eq 22

!
! ============================================================
! ACCESS LISTS
! ============================================================
!

access-list OUTSIDE_IN extended permit ip any any

access-list OUTSIDE_IN extended permit tcp any any eq 22

access-list OUTSIDE_IN extended permit tcp any any eq 3389

access-list OUTSIDE_IN extended permit tcp any host 10.10.10.10 eq 443

access-list OUTSIDE_IN extended permit tcp any object-group WEB_SERVERS eq 443

access-list INSIDE_OUT extended permit tcp 10.10.0.0 255.255.0.0 any eq 443

access-list OUTSIDE_IN extended deny ip any any

access-list OUTSIDE_IN extended permit tcp any host 10.10.10.10 eq 443

access-list OUTSIDE_IN extended permit tcp any host 10.10.10.10 eq 443

object network PUBLIC_WEB
 host 10.10.10.10
 nat (inside,outside) static 203.0.113.10


route outside 0.0.0.0 0.0.0.0 192.0.2.1 1