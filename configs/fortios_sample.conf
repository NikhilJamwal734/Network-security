# Safe synthetic FortiOS CLI export for API-009.6 demonstrations.
config firewall address
    edit "WEB_SERVER"
        set subnet 192.0.2.10 255.255.255.255
    next
    edit "ANY_IPV4"
        set subnet 0.0.0.0 0.0.0.0
    next
end
config firewall service custom
    edit "CUSTOM_HTTPS"
        set tcp-portrange 443
    next
end
config system interface
    edit "port1"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh
    next
    edit "port2"
        set allowaccess ping http telnet
    next
end
config firewall policy
    edit 1
        set name "Restricted web"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "WEB_SERVER"
        set dstaddr "WEB_SERVER"
        set action accept
        set schedule "always"
        set service "CUSTOM_HTTPS"
        set logtraffic all
    next
    edit 2
        set name "Review broad policy"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set utm-status disable
    next
end
